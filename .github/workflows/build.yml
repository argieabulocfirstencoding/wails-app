name: Build and Release
on:
  push:
    tags:
      - "v*"
    workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5 # Updated to v5
        with:
          go-version: "1.24" # Matches current Go standards for Wails

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Modern LTS

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build NSIS Installer
        # -clean ensures no stale artifacts; NSIS generates the .exe in build/bin/
        run: wails build -nsis -clean -ldflags "-H=windowsgui -X main.App.CurrentVersion=$VERSION"

      - name: Upload to Release Repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh # Explicitly use PowerShell for variable consistency
        run: |
          $VERSION = "${{ github.ref_name }}"
          # Target the specific FES-APP-TRACKER repo
          # We use a wildcard to grab the -installer.exe generated by Wails
          gh release upload $VERSION "build/bin/FesApp Tracker.exe"
            --repo FES-Paul/FES-APP-TRACKER `
            --title "FES Tracker $VERSION" `
            --generate-notes
