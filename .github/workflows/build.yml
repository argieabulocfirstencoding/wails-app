name: Build and Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated to 22 as we discussed for stability

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          wails build -nsis -clean -ldflags "-H=windowsgui -X main.App.CurrentVersion=$VERSION"

      - name: Upload to Release Repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          $REPO = "FES-Paul/FES-APP-TRACKER"
          $FILE = "build/bin/FesApp Tracker.exe"

          # 1. Try to create the release. If it exists, '|| echo' prevents the script from crashing.
          gh release create $VERSION --repo $REPO --title "FESAPP TRACKER $VERSION" --generate-notes --verify-tag || echo "Release already exists, moving to upload..."

          # 2. Upload the file. '--clobber' works here to overwrite old versions.
          gh release upload $VERSION "$FILE" --repo $REPO --clobber

      
