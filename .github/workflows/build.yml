name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing source tag from main, for example v2.5.1"
        required: true
        type: string

permissions:
  contents: read

# Serialize production publication; never interrupt an upload halfway through.
concurrency:
  group: stable-desktop-release
  cancel-in-progress: false

env:
  B2_BUCKET: fesapp-updates
  B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
  B2_PUBLIC_BASE_URL: https://fesapp-updates.s3.us-east-005.backblazeb2.com

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Validate requested version
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Use a stable version tag such as v2.5.1.'
          }
          $version = $tag.Substring(1)
          foreach ($part in $version.Split('.')) {
            if ([long]$part -gt 65535) { throw 'Windows version components must be at most 65535.' }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check out the source tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Require a commit merged into main
        id: source
        shell: pwsh
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Merge this commit into main before releasing it.' }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the source commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend and updater tests
        run: go test ./backend/... ./internal/...

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          $makensis = @(
            'C:\Program Files (x86)\NSIS\makensis.exe'
            'C:\Program Files\NSIS\makensis.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $makensis) { throw 'makensis.exe was not found.' }
          Split-Path -Parent $makensis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build stable installer and manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          UPDATE_MANIFEST_PUBLIC_KEY: ${{ vars.UPDATE_MANIFEST_PUBLIC_KEY }}
        run: |
          $version = $env:RELEASE_VERSION
          $installer = 'FESApp-Setup.exe'
          if (-not $env:UPDATE_MANIFEST_PUBLIC_KEY) { throw 'Add the UPDATE_MANIFEST_PUBLIC_KEY repository variable before releasing.' }
          try { $publicKey = [Convert]::FromBase64String($env:UPDATE_MANIFEST_PUBLIC_KEY) } catch { throw 'UPDATE_MANIFEST_PUBLIC_KEY must be standard base64.' }
          if ($publicKey.Length -ne 32) { throw 'UPDATE_MANIFEST_PUBLIC_KEY must decode to a 32-byte Ed25519 public key.' }
          # Use the tag for both Windows metadata and the updater's build identity.
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $version
          $config | ConvertTo-Json -Depth 30 | Set-Content wails.json -Encoding utf8NoBOM
          $ldflags = @(
            "-X fesapp/internal/buildinfo.Version=$version"
            '-X fesapp/internal/buildinfo.Environment=production'
            '-X fesapp/internal/buildinfo.UpdateChannel=stable'
            '-X fesapp/internal/buildinfo.UpdateBranch=main'
            "-X fesapp/internal/buildinfo.CommitSHA=$env:SOURCE_COMMIT"
            "-X fesapp/internal/buildinfo.BuildNumber=$env:GITHUB_RUN_NUMBER"
            "-X fesapp/backend/app.CurrentVersion=$version"
            "-X fesapp/internal/updater.StableManifestPublicKey=$env:UPDATE_MANIFEST_PUBLIC_KEY"
          ) -join ' '
          # Wails generates bindings before the frontend TypeScript/Vite build.
          wails build -clean -nsis -platform windows/amd64 -ldflags "$ldflags"
          if ($LASTEXITCODE -ne 0) { throw 'Wails build failed.' }
          $built = @(Get-ChildItem build/bin -Filter '*installer.exe')
          if ($built.Count -ne 1) { throw 'Expected exactly one generated installer.' }
          Copy-Item -LiteralPath $built[0].FullName -Destination $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installer" | Set-Content "$installer.sha256" -Encoding utf8NoBOM
          [ordered]@{
            channel = 'stable'
            branch = 'main'
            version = $version
            runNumber = [int]$env:GITHUB_RUN_NUMBER
            commitSha = $env:SOURCE_COMMIT
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            mandatory = $false
            installerAsset = $installer
            sha256Asset = "$installer.sha256"
            installerSha256 = $hash
          } | ConvertTo-Json | Set-Content stable-manifest.json -Encoding utf8NoBOM

      - name: Sign the stable update manifest
        shell: pwsh
        env:
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_MANIFEST_SIGNING_KEY) { throw 'Add the UPDATE_MANIFEST_SIGNING_KEY repository secret before releasing.' }
          go run ./cmd/update-manifest-sign -input stable-manifest.json -output latest.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not sign the stable update manifest.' }

      - name: Publish the signed stable release to Backblaze B2
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: us-east-005
          AWS_EC2_METADATA_DISABLED: true
        run: |
          if (-not $env:AWS_ACCESS_KEY_ID -or -not $env:AWS_SECRET_ACCESS_KEY) { throw 'Add B2_KEY_ID and B2_APPLICATION_KEY repository secrets before releasing.' }
          aws --version
          if ($LASTEXITCODE -ne 0) { throw 'AWS CLI is unavailable on this runner.' }

          $version = $env:RELEASE_VERSION
          $prefix = "stable/$version"
          $publicVersionURL = "$env:B2_PUBLIC_BASE_URL/$prefix"
          foreach ($name in @('FESApp-Setup.exe', 'FESApp-Setup.exe.sha256', 'stable-manifest.json')) {
            $status = curl.exe --silent --output NUL --write-out '%{http_code}' --head "$publicVersionURL/$name"
            if ($LASTEXITCODE -ne 0) { throw "Could not check whether $name already exists in B2." }
            if ($status -ne '404') { throw "B2 already contains $prefix/$name. Release files are immutable; use a new version tag." }
          }

          # Backblaze documents `aws s3 cp` as the supported AWS CLI transfer path.
          # It avoids the low-level PutObject transport path that some runners close.
          aws s3 cp FESApp-Setup.exe "s3://$env:B2_BUCKET/$prefix/FESApp-Setup.exe" --endpoint-url $env:B2_ENDPOINT --no-progress --content-type application/octet-stream --cache-control 'public, max-age=31536000, immutable'
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the installer to B2.' }
          aws s3 cp FESApp-Setup.exe.sha256 "s3://$env:B2_BUCKET/$prefix/FESApp-Setup.exe.sha256" --endpoint-url $env:B2_ENDPOINT --no-progress --content-type text/plain --cache-control 'public, max-age=31536000, immutable'
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the installer checksum to B2.' }
          aws s3 cp stable-manifest.json "s3://$env:B2_BUCKET/$prefix/stable-manifest.json" --endpoint-url $env:B2_ENDPOINT --no-progress --content-type application/json --cache-control 'public, max-age=31536000, immutable'
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the signed manifest payload to B2.' }

          foreach ($name in @('FESApp-Setup.exe', 'FESApp-Setup.exe.sha256', 'stable-manifest.json')) {
            $status = curl.exe --silent --output NUL --write-out '%{http_code}' --head "$publicVersionURL/$name"
            if ($LASTEXITCODE -ne 0 -or $status -ne '200') { throw "B2 did not make $name publicly available." }
          }

          aws s3 cp latest.json "s3://$env:B2_BUCKET/stable/latest.json" --endpoint-url $env:B2_ENDPOINT --no-progress --content-type application/json --cache-control 'no-store, max-age=0'
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the stable B2 update pointer.' }
          $latest = Invoke-WebRequest -Uri "$env:B2_PUBLIC_BASE_URL/stable/latest.json" -UseBasicParsing
          if ($latest.StatusCode -ne 200 -or -not (($latest.Content | ConvertFrom-Json).payload)) { throw 'The signed B2 update pointer is not publicly available.' }
