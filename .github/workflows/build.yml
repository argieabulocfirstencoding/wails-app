name: Build and Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated to 22 as we discussed for stability

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          wails build -nsis -clean -ldflags "-H=windowsgui -X main.App.CurrentVersion=$VERSION"

      - name: Upload to Release Repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          # Added --clobber so it overwrites if you run it multiple times for the same tag
          gh release upload $VERSION "build/bin/FesApp Tracker.exe" --repo FES-Paul/FES-APP-TRACKER --clobber
