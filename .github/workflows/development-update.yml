name: Development Desktop Update

on:
  push:
    branches:
      - developer/jomary
  workflow_dispatch:

permissions:
  contents: read

env:
  UPDATES_REPOSITORY: argieabulocfirstencoding/fesapp-updates

concurrency:
  group: development-update-developer-jomary
  cancel-in-progress: true

jobs:
  build-and-publish-development:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.0
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Go tests
        # The root package embeds frontend/dist, which is generated by the Wails
        # build below. Test all backend and updater packages before that build.
        run: go test ./backend/... ./internal/...

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress

          # Chocolatey's NSIS package installs makensis.exe under Program Files
          # but does not consistently expose it on PATH in GitHub-hosted runners.
          $nsisCandidates = @(
            'C:\Program Files (x86)\NSIS\makensis.exe'
            'C:\Program Files\NSIS\makensis.exe'
          )
          $makensis = $nsisCandidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1

          if (-not $makensis) {
            throw "NSIS was installed, but makensis.exe was not found in a supported installation directory."
          }

          Split-Path -Parent $makensis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Build the development installer
        id: build
        shell: pwsh
        run: |
          $version = "0.0.0-dev.${{ github.run_number }}"
          $installerName = "FESApp-Development-Setup.exe"
          $ldflags = @(
            "-X fesapp/internal/buildinfo.Version=$version"
            "-X fesapp/internal/buildinfo.Environment=development"
            "-X fesapp/internal/buildinfo.UpdateChannel=development"
            "-X fesapp/internal/buildinfo.UpdateBranch=developer/jomary"
            "-X fesapp/internal/buildinfo.CommitSHA=${{ github.sha }}"
            "-X fesapp/internal/buildinfo.BuildNumber=${{ github.run_number }}"
          ) -join " "

          # Wails generates frontend/wailsjs before invoking `npm run build`.
          # Do not type-check the frontend in a separate earlier step because a
          # fresh GitHub Actions checkout does not yet contain those bindings.
          wails build -clean -nsis -platform windows/amd64 -ldflags "$ldflags"

          $sourceInstaller = Get-ChildItem build/bin -Filter "*installer.exe" |
            Select-Object -First 1
          if (-not $sourceInstaller) {
            throw "NSIS installer was not found under build/bin."
          }

          $installerPath = Join-Path $PWD $installerName
          Copy-Item $sourceInstaller.FullName $installerPath -Force
          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $installerName" | Set-Content "$installerPath.sha256" -Encoding utf8

          "version=$version" >> $env:GITHUB_OUTPUT
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "installer_path=$installerPath" >> $env:GITHUB_OUTPUT
          "checksum_path=$installerPath.sha256" >> $env:GITHUB_OUTPUT

      - name: Generate development manifest
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            channel = "development"
            branch = "developer/jomary"
            version = "${{ steps.build.outputs.version }}"
            runNumber = [int]"${{ github.run_number }}"
            commitSha = "${{ github.sha }}"
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            mandatory = $false
            installerAsset = "${{ steps.build.outputs.installer_name }}"
            sha256Asset = "${{ steps.build.outputs.installer_name }}.sha256"
          }
          $manifest | ConvertTo-Json | Set-Content development-manifest.json -Encoding utf8

      - name: Create the fixed development prerelease when needed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
        run: |
          gh release view development-latest --repo "$env:UPDATES_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create development-latest --repo "$env:UPDATES_REPOSITORY" --target main --title "Latest Development Build" --prerelease --notes "Automated development build."
          }

      - name: Publish development installer and manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
        run: |
          gh release upload development-latest --repo "$env:UPDATES_REPOSITORY" "${{ steps.build.outputs.installer_path }}" "${{ steps.build.outputs.checksum_path }}" development-manifest.json --clobber
